<button type="button" class="button delete-trigger" popovertarget="delete-award-{{ award.id }}" aria-label="Hapus {{ award.title }}" title="Hapus award">Hapus Award</button>
<div id="delete-award-{{ award.id }}" class="project-delete-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="delete-award-title-{{ award.id }}">
    <button type="button" class="project-delete-modal__backdrop" popovertarget="delete-award-{{ award.id }}" popovertargetaction="hide" aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close" popovertarget="delete-award-{{ award.id }}" popovertargetaction="hide" aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 class="delete-form-text" id="delete-award-title-{{ award.id }}">Hapus Award?</h2>
        <p class="delete-form-text">Apakah Anda yakin ingin menghapus <strong>{{ award.title }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary" popovertarget="delete-award-{{ award.id }}" popovertargetaction="hide">Batal</button>
            <form id="delete-award-form-{{ award.id }}" method="post" action="{% url 'main:delete_awards' award.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
